# Publishes the contents of site/ to GitHub Pages every time you push to main.
# The site is already built (site/index.html + site/data/), so this only uploads it.
# To change the data, run `python pipeline/run_all.py` on your computer, commit, push.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
